name: Sketchdeck.ai
description: >-
  SketchDeck.ai is a B2B SaaS company whose flagship product, LIFT, is
  AI-powered material takeoff and counting software for the structural steel
  fabrication and erection industry. LIFT analyzes uploaded blueprints and
  shop drawings to automatically extract quantities and generate Bills of
  Materials, with claimed 95-99% accuracy and up to an 80% reduction in
  takeoff time so estimators can complete bids in minutes rather than hours or
  days. The platform adds revision management and exports data to industry
  estimating programs; the company reports more than $25 billion in projects
  bid through LIFT to date. SketchDeck.ai is a Techstars-backed startup. As of
  this enrichment pass the company publishes a marketing and demo-request
  website only - there is no public API, developer portal, SDK, or
  machine-readable specification surface to catalog.
